name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # If you created requirements-dev.txt, this will work:
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install pytest httpx; fi

      - name: Run tests
        working-directory: api
        env:
          # Keeps app imports happy if anything reads DATABASE_URL at import time
          DATABASE_URL: "sqlite+pysqlite://"
        run: |
          pytest -q